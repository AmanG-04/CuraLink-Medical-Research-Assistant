services:
  - type: web
    name: curalink-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: HF_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
      - key: HF_FALLBACK_MODELS
        value: Qwen/Qwen2.5-1.5B-Instruct,Qwen/Qwen2.5-0.5B-Instruct
      - key: NCBI_API_KEY
        sync: false
      - key: NCBI_TOOL
        value: curalink
      - key: NCBI_EMAIL
        sync: false
