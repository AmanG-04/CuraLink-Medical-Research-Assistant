name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec --workspace client -- playwright install --with-deps chromium
      - run: npm run ci:check
        env:
          MONGODB_URI: ""
          HF_API_TOKEN: ""
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-traces
          path: client/test-results
          retention-days: 7
